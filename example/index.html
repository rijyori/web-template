<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf5ec">
  <!-- 1) 테마: CSS보다 먼저 (깜빡임 방지) -->
  <script src="../core/theme.js"></script>
  <title data-en="Template Example">템플릿 예시</title>
  <meta name="description" content="공용 웹 템플릿 예시 페이지" data-en="Example page for the shared web template">
  <!-- 2) 컬러 테마 하나 + 공용 바탕·부품 -->
  <link rel="stylesheet" href="../themes/sumikko.css">
  <link rel="stylesheet" href="../core/base.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 80px) 16px 48px;
      display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { margin: 0 0 8px; font-size: 36px; font-weight: 900; }
    .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 320px; margin-top: 12px; }
    .swatches i { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="theme corner" role="group" aria-label="화면 테마" data-en-aria="Theme">
    <button type="button" data-theme="auto" data-en="Auto">자동</button>
    <button type="button" data-theme="light" data-en="Light">라이트</button>
    <button type="button" data-theme="dark" data-en="Dark">다크</button>
  </div>
  <main>
    <h1 data-en="Hello">안녕하세요</h1>
    <p data-en-html="Korean browsers see Korean,<br>everything else sees English.">한국어 브라우저에서는 한국어,<br>그 밖에서는 영어로 보입니다.</p>
    <button class="menu-btn t2" id="b-toast" type="button" data-en="Show toast">토스트 띄우기</button>
    <button class="menu-btn t3" id="b-modal" type="button" data-en="Open modal">모달 열기</button>
    <button class="round-btn" type="button" aria-label="새로고침" data-en-aria="Reload" onclick="location.reload()">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="swatches"><i style="background:var(--t1)"></i><i style="background:var(--t2)"></i><i style="background:var(--t3)"></i><i style="background:var(--t4)"></i></div>
  </main>

  <!-- 3) 한/영: body 끝, 모듈보다 먼저 -->
  <script src="../core/i18n.js"></script>
  <script type="module">
    import { toast, modal } from '../core/ui.js';
    const t = globalThis.L10N?.t ?? ((k) => k);
    document.getElementById('b-toast').onclick = () => toast(t('저장했습니다', 'Saved'));
    document.getElementById('b-modal').onclick = () => modal(t('확인', 'Confirm'), t('정말 할까요?', 'Are you sure?'), [
      { label: t('네', 'Yes'), run: () => toast(t('했습니다', 'Done')) },
      { label: t('취소', 'Cancel'), secondary: true },
    ]);
  </script>
</body>
</html>
